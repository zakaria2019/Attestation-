name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl pywin32 pyinstaller

      - name: Build portable EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "Attestations_Ouarzazate" --hidden-import win32timezone app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Attestations_Ouarzazate_EXE
          path: dist/Attestations_Ouarzazate.exe
          if-no-files-found: error
